<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hotels — Tailora Admin</title>

  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
  >

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body
  data-page="hotels"
  data-page-title="Hotels"
  data-breadcrumb="Management,Hotels"
  data-requires-auth="true"
>

  <div class="tl-app">

    <!-- Sidebar -->
    <aside
      class="tl-sidebar offcanvas offcanvas-start offcanvas-lg"
      tabindex="-1"
      id="tlSidebar"
      aria-labelledby="tlSidebarLabel"
    ></aside>

    <div class="tl-main">

      <!-- Topbar -->
      <header
        class="tl-topbar"
        id="tlTopbar"
      ></header>

      <main class="tl-content">

        <!-- ======================================================
             PAGE HEADER
        ======================================================= -->

        <div class="tl-page-header">

          <div>

            <div class="tl-eyebrow">

              <span class="tl-badge tl-badge--info">
                <i class="bi bi-building"></i>
                Hotel Management
              </span>

            </div>

            <h1 class="tl-page-title">
              Hotels
            </h1>

            <p class="tl-text-secondary">
              Manage hotels using the real hotel records stored in the database.
            </p>

          </div>
          <button class="tl-btn tl-btn--primary" type="button" data-bs-toggle="modal" data-bs-target="#hotelCreateModal">
            <i class="bi bi-plus-lg"></i> Add Hotel
          </button>

        </div>


        <!-- ======================================================
             HOTEL LIST
        ======================================================= -->

        <div
          class="tl-card tl-card--accent"
          style="margin-bottom: 20px;"
        >

          <div id="hotelList"></div>

        </div>


        <!-- ======================================================
             CREATE / UPDATE
        ======================================================= -->

        <div class="row g-4">

          <!-- ====================================================
               CREATE HOTEL
          ===================================================== -->

        <!-- Create Hotel Modal -->
        <div class="modal fade" id="hotelCreateModal" tabindex="-1" aria-labelledby="hotelCreateModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content tl-modal">
              <div class="modal-header">
                <h5 class="modal-title" id="hotelCreateModalLabel">Add New Hotel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <form id="hotelCreateForm">
                <div class="modal-body">

                <!-- Name -->

                <div class="tl-field">

                  <label for="hotel_name">
                    Name
                  </label>

                  <input
                    id="hotel_name"
                    name="hotel_name"
                    type="text"
                    class="tl-input"
                    placeholder="Hotel name"
                    required
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_name"
                  ></div>

                </div>


                <!-- City -->

                <div class="tl-field">

                  <label for="hotel_city">
                    City
                  </label>

                  <input
                    id="hotel_city"
                    name="hotel_city"
                    type="text"
                    class="tl-input"
                    placeholder="City"
                    required
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_city"
                  ></div>

                </div>


                <!-- Price -->

                <div class="tl-field">

                  <label for="hotel_price_per_night">
                    Price per night
                  </label>

                  <input
                    id="hotel_price_per_night"
                    name="hotel_price_per_night"
                    type="number"
                    class="tl-input"
                    placeholder="Price per night"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_price_per_night"
                  ></div>

                </div>


                <!-- Available Rooms -->

                <div class="tl-field">

                  <label for="hotel_available_rooms">
                    Available rooms
                  </label>

                  <input
                    id="hotel_available_rooms"
                    name="hotel_available_rooms"
                    type="number"
                    class="tl-input"
                    placeholder="Available rooms"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_available_rooms"
                  ></div>

                </div>


                <!-- Neighborhood -->

                <div class="tl-field">

                  <label for="hotel_neighborhood">
                    Neighborhood
                  </label>

                  <input
                    id="hotel_neighborhood"
                    name="hotel_neighborhood"
                    type="text"
                    class="tl-input"
                    placeholder="Neighborhood"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_neighborhood"
                  ></div>

                </div>


                <!-- Distance -->

                <div class="tl-field">

                  <label for="hotel_distance_km">
                    Distance (km)
                  </label>

                  <input
                    id="hotel_distance_km"
                    name="hotel_distance_km"
                    type="number"
                    step="0.1"
                    class="tl-input"
                    placeholder="Distance in km"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_distance_km"
                  ></div>

                </div>


                <!-- Rating -->

                <div class="tl-field">

                  <label for="hotel_rating">
                    Rating
                  </label>

                  <input
                    id="hotel_rating"
                    name="hotel_rating"
                    type="number"
                    step="0.1"
                    class="tl-input"
                    placeholder="Rating"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_rating"
                  ></div>

                </div>


                <!-- Review Count -->

                <div class="tl-field">

                  <label for="hotel_review_count">
                    Review count
                  </label>

                  <input
                    id="hotel_review_count"
                    name="hotel_review_count"
                    type="number"
                    class="tl-input"
                    placeholder="Review count"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_review_count"
                  ></div>

                </div>


                <!-- Amenities -->

                <div class="tl-field">

                  <label for="hotel_amenities">
                    Amenities
                  </label>

                  <textarea
                    id="hotel_amenities"
                    name="hotel_amenities"
                    class="tl-textarea"
                    rows="4"
                    placeholder="Amenities"
                  ></textarea>

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_amenities"
                  ></div>

                </div>


                <button
                </div>
                <div class="modal-footer">
                  <button type="button" class="tl-btn tl-btn--outline" data-bs-dismiss="modal">Cancel</button>
                  <button class="tl-btn tl-btn--primary" type="submit">Create hotel</button>
                </div>
              </form>
            </div>
          </div>
        </div>


          <!-- ====================================================
               UPDATE / DELETE HOTEL
          ===================================================== -->

          <div class="col-xl-6">

            <section class="tl-card">

              <div class="tl-card__head">

                <div class="tl-section-title">
                  Update / Delete
                </div>

                <span class="tl-metadata">
                  PUT / DELETE /admin/hotels/{id}
                </span>

              </div>


              <form id="hotelManageForm">

                <!-- Hotel ID -->

                <div class="tl-field">

                  <label for="hotel_id">
                    Hotel ID
                  </label>

                  <input
                    id="hotel_id"
                    name="hotel_id"
                    type="number"
                    class="tl-input"
                    placeholder="ID"
                    required
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_id"
                  ></div>

                </div>


                <!-- Name -->

                <div class="tl-field">

                  <label for="hotel_u_name">
                    Name
                  </label>

                  <input
                    id="hotel_u_name"
                    name="hotel_u_name"
                    type="text"
                    class="tl-input"
                    placeholder="Hotel name"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_name"
                  ></div>

                </div>


                <!-- City -->

                <div class="tl-field">

                  <label for="hotel_u_city">
                    City
                  </label>

                  <input
                    id="hotel_u_city"
                    name="hotel_u_city"
                    type="text"
                    class="tl-input"
                    placeholder="City"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_city"
                  ></div>

                </div>


                <!-- Neighborhood -->

                <div class="tl-field">

                  <label for="hotel_u_neighborhood">
                    Neighborhood
                  </label>

                  <input
                    id="hotel_u_neighborhood"
                    name="hotel_u_neighborhood"
                    type="text"
                    class="tl-input"
                    placeholder="Neighborhood"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_neighborhood"
                  ></div>

                </div>


                <!-- Distance -->

                <div class="tl-field">

                  <label for="hotel_u_distance_km">
                    Distance (km)
                  </label>

                  <input
                    id="hotel_u_distance_km"
                    name="hotel_u_distance_km"
                    type="number"
                    step="0.1"
                    class="tl-input"
                    placeholder="Distance in km"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_distance_km"
                  ></div>

                </div>


                <!-- Price -->

                <div class="tl-field">

                  <label for="hotel_u_price_per_night">
                    Price per night
                  </label>

                  <input
                    id="hotel_u_price_per_night"
                    name="hotel_u_price_per_night"
                    type="number"
                    class="tl-input"
                    placeholder="Price per night"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_price_per_night"
                  ></div>

                </div>


                <!-- Rating -->

                <div class="tl-field">

                  <label for="hotel_u_rating">
                    Rating
                  </label>

                  <input
                    id="hotel_u_rating"
                    name="hotel_u_rating"
                    type="number"
                    step="0.1"
                    class="tl-input"
                    placeholder="Rating"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_rating"
                  ></div>

                </div>


                <!-- Review Count -->

                <div class="tl-field">

                  <label for="hotel_u_review_count">
                    Review count
                  </label>

                  <input
                    id="hotel_u_review_count"
                    name="hotel_u_review_count"
                    type="number"
                    class="tl-input"
                    placeholder="Review count"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_review_count"
                  ></div>

                </div>


                <!-- Amenities -->

                <div class="tl-field">

                  <label for="hotel_u_amenities">
                    Amenities
                  </label>

                  <textarea
                    id="hotel_u_amenities"
                    name="hotel_u_amenities"
                    class="tl-textarea"
                    rows="4"
                    placeholder="Amenities"
                  ></textarea>

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_amenities"
                  ></div>

                </div>


                <!-- Available Rooms -->

                <div class="tl-field">

                  <label for="hotel_u_available_rooms">
                    Available rooms
                  </label>

                  <input
                    id="hotel_u_available_rooms"
                    name="hotel_u_available_rooms"
                    type="number"
                    class="tl-input"
                    placeholder="Available rooms"
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="hotel_u_available_rooms"
                  ></div>

                </div>


                <!-- Buttons -->

                <div class="tl-flex tl-gap-sm">

                  <button
                    class="tl-btn tl-btn--primary"
                    type="submit"
                  >
                    Update hotel
                  </button>

                  <button
                    class="tl-btn tl-btn--danger"
                    id="hotelDeleteBtn"
                    type="button"
                  >
                    Delete hotel
                  </button>

                </div>

              </form>

            </section>

          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- ============================================================
       SCRIPTS
  ============================================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"
  ></script>

  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script src="assets/js/api/hotels.js"></script>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/utils.js"></script>
  <script src="assets/js/pages/hotels.js"></script>

</body>
</html>
