<body

  <div class="tl-app">

    <!-- Sidebar -->

        <!-- ======================================================
             PAGE HEADER
             ====================================================== -->

        <div class="tl-page-header">

          <div>

            <div class="tl-eyebrow">

              <span class="tl-badge tl-badge--info">

                <i class="bi bi-cup-hot"></i>

                Restaurant Management

              </span>

            </div>


            <h1 class="tl-page-title">
              Restaurants
            </h1>


            <p class="tl-text-secondary">
              Manage restaurants using the real records stored in the database.
            </p>

          </div>
          <button class="tl-btn tl-btn--primary" type="button" data-bs-toggle="modal" data-bs-target="#restaurantCreateModal">

             ====================================================== -->

                <i class="bi bi-hourglass-split"></i>
              </div>

              <div class="tl-section-title">
                Loading restaurants...
              </div>

            </div>

          </div>

        </div>



        <!-- ======================================================
             CREATE / UPDATE
             ====================================================== -->

          <!-- ====================================================
               CREATE RESTAURANT
               ==================================================== -->

        <!-- Create Restaurant Modal -->

              <form id="restaurantCreateForm">

                <div class="tl-field">

                  <label for="restaurant_name">
                    Name

                  <input
                    id="restaurant_name"
                    name="restaurant_name"
                    type="text"
                    class="tl-input"
                    placeholder="Restaurant name"
                    required
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="restaurant_name"
                  ></div>

                </div>


                <div class="tl-field">

                  <label for="restaurant_city">
                    City
                  </label>

                  <input
                    id="restaurant_city"
                    name="restaurant_city"
                    type="text"
                    class="tl-input"
                    placeholder="City"
                    required
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="restaurant_city"
                  ></div>

                </div>


                <div class="tl-field">

                  <label for="restaurant_address">
                    Address
                  </label>

                  <input
                    id="restaurant_address"
                    name="restaurant_address"
                    type="text"
                    class="tl-input"
                    placeholder=""
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="restaurant_address"

                    Average cost for two

                  <input

                    type="number"
                    class="tl-input"
                    placeholder=""
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="restaurant_average_cost_for_two"
                  ></div>

                </div>


                <div class="tl-field">

                  <label for="restaurant_price_range">
                    Price range
                  </label>

                  <input
                    id="restaurant_price_range"
                    name="restaurant_price_range"
                    type="number"
                    class="tl-input"
                    placeholder=""
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="restaurant_price_range"
                  ></div>

                </div>


                <div class="tl-field">

                  <label for="restaurant_locality">
                    Locality
                  </label>

                  <input
                    id="restaurant_locality"

                  </label>

                  <select
                    id="restaurant_has_table_booking"
                    name="restaurant_has_table_booking"
                    class="tl-select"

                    <option value="">
                      Select
                    </option>

                    <option value="true">
                      true
                    </option>

                    <option value="false">
                      false

                  </select>

                  <div

                    data-error-for="restaurant_has_table_booking"

                <div class="tl-field">

                <div class="tl-field">

                  <label for="restaurant_is_delivering_now">
                    Is delivering now
                  </label>

                  <select
                    id="restaurant_is_delivering_now"
                    name="restaurant_is_delivering_now"
                    class="tl-select"
                  >

                    <option value="">
                      Select
                    </option>

                    <option value="true">
                      true
                    </option>

                    <option value="false">
                      false
                    </option>

                  </select>

                  <div
                    class="tl-field-error"
                    data-error-for="restaurant_is_delivering_now"

                </div>


                <div class="tl-field">

                    class="tl-input"
                    placeholder=""
                  >

                  <div
                    class="tl-field-error"
                    data-error-for="restaurant_votes"
                  ></div>

                </div>


                </div>
                <div class="modal-footer">
                  <button type="button" class="tl-btn tl-btn--outline" data-bs-dismiss="modal">Cancel</button>
                  <button class="tl-btn tl-btn--primary" type="submit">Create restaurant</button>
