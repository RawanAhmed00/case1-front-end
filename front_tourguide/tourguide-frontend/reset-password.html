<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Tailora Tour Guide</title>

  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-guest-only="true" class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 460px;">
    <div class="tl-card p-4 p-md-5 tl-card--accent text-center shadow-lg">

      <!-- Logo & Brand -->
      <div class="mb-4">
        <img src="assets/images/logo.png" alt="Tailora" class="mx-auto mb-3" style="width: 54px; height: 54px; object-fit: contain;">
        <span class="tl-badge tl-badge--info mb-2"><i class="bi bi-compass"></i> Tour Guide Portal</span>
        <h2 class="tl-page-title mt-2 mb-1">Set New Password</h2>
        <p class="tl-text-secondary small mb-0">Choose a new password for your Tour Guide account.</p>
      </div>

      <!-- Reset Form Panel -->
      <div id="tlResetFormPanel">
        <form id="tlResetForm" novalidate class="text-start">
          <div class="tl-field">
            <label for="tlResetPassword">New Password</label>
            <div class="tl-input-group">
              <i class="bi bi-lock tl-input-icon"></i>
              <input type="password" id="tlResetPassword" class="tl-input" placeholder="••••••••" required autocomplete="new-password">
            </div>
            <div class="tl-field-error" id="tlResetPasswordError"></div>
          </div>

          <div class="tl-field">
            <label for="tlResetPasswordConfirm">Confirm New Password</label>
            <div class="tl-input-group">
              <i class="bi bi-lock tl-input-icon"></i>
              <input type="password" id="tlResetPasswordConfirm" class="tl-input" placeholder="••••••••" required autocomplete="new-password">
            </div>
            <div class="tl-field-error" id="tlResetPasswordConfirmError"></div>
          </div>

          <button type="submit" class="tl-btn tl-btn--primary tl-btn--block py-3 mt-3 fs-6" id="tlResetSubmitBtn">
            <i class="bi bi-check2-circle me-1"></i> Reset Password
          </button>
        </form>
      </div>

      <!-- Success Panel -->
      <div id="tlResetSuccessPanel" style="display: none;" class="py-3">
        <div class="text-teal fs-1 mb-2">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h5 class="text-light mb-2">Password Reset Successful</h5>
        <p class="tl-text-secondary small mb-3">Your password has been reset successfully. You can now login with your new credentials.</p>
        <a href="index.html" class="tl-btn tl-btn--primary tl-btn--block py-2">
          Proceed to Login
        </a>
      </div>

      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <a href="index.html" class="tl-metadata text-teal text-decoration-none fw-semibold">
          <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 Bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- API Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      const email = urlParams.get("email");

      const form = document.getElementById("tlResetForm");
      if (!form) return;

      const passInput = document.getElementById("tlResetPassword");
      const confirmInput = document.getElementById("tlResetPasswordConfirm");
      const passErr = document.getElementById("tlResetPasswordError");
      const confirmErr = document.getElementById("tlResetPasswordConfirmError");
      const submitBtn = document.getElementById("tlResetSubmitBtn");
      const formPanel = document.getElementById("tlResetFormPanel");
      const successPanel = document.getElementById("tlResetSuccessPanel");

      if (!token || !email) {
        if (passErr) passErr.textContent = "Invalid or expired reset link. Please request a new one.";
        if (submitBtn) submitBtn.disabled = true;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (passErr) passErr.textContent = "";
        if (confirmErr) confirmErr.textContent = "";

        const password = passInput ? passInput.value.trim() : "";
        const passwordConfirm = confirmInput ? confirmInput.value.trim() : "";

        let valid = true;
        if (!password || password.length < 8) {
          if (passErr) passErr.textContent = "Password must be at least 8 characters long.";
          valid = false;
        }
        if (password !== passwordConfirm) {
          if (confirmErr) confirmErr.textContent = "Passwords do not match.";
          valid = false;
        }

        if (!valid) return;

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Resetting...';
        }

        try {
          await window.TL.Auth.resetPassword({
            token,
            email,
            password,
            password_confirmation: passwordConfirm
          });
          if (formPanel) formPanel.style.display = "none";
          if (successPanel) successPanel.style.display = "block";
        } catch (err) {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Reset Password';
          }

          if (err instanceof window.TL.Api.ApiValidationError && err.errors) {
            if (err.errors.password && passErr) passErr.textContent = err.errors.password.join(" ");
          } else {
            if (passErr) passErr.textContent = err.message || "Failed to reset password. Please request a new link.";
          }
        }
      });
    });
  </script>
</body>
</html>
