<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages & Chat — Tailora Tour Guide</title>

  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/laravel-echo@1.15.3/dist/echo.iife.js"></script>
</head>
<script>
    
    window.Pusher = Pusher;

    window.Echo = new Echo({
        broadcaster: 'pusher',
        key: 'd5f2c5fc19420db851e8', 
        cluster: 'eu', 
        forceTLS: true
    });

    
    window.Echo.channel('my-channel')
        .listen('.MyEvent', (e) => {
            console.log(e);
        });
</script>
<body data-page="messages" data-page-title="Messages & Chat" data-breadcrumb="Growth & Messages, Chat" data-requires-auth="true">

<div class="tl-app">

  <!-- SIDEBAR -->
  <aside class="tl-sidebar offcanvas offcanvas-start offcanvas-lg" tabindex="-1" id="tlSidebar" aria-labelledby="tlSidebarLabel"></aside>

  <!-- MAIN WRAPPER -->
  <div class="tl-main">

    <!-- TOPBAR -->
    <header class="tl-topbar" id="tlTopbar"></header>

    <!-- MAIN CONTENT -->
    <main class="tl-content">

      <!-- Page Header -->
      <div class="tl-page-header mb-3">
        <div>
          <div class="tl-eyebrow">
            <span class="tl-badge tl-badge--info"><i class="bi bi-chat-dots"></i> Live Messaging</span>
          </div>
          <h1 class="tl-page-title">
            Traveler <span class="tl-gradient-text">Chat Center</span>
          </h1>
        </div>
      </div>

      <!-- CHAT INTERFACE LAYOUT -->
      <div class="tl-chat-layout">

        <!-- CHAT SIDEBAR (Conversations list) -->
        <div class="tl-chat-sidebar">
          <div class="tl-chat-sidebar__header">
            <h6 class="text-light mb-0"><i class="bi bi-chat-left-text me-2 text-teal"></i> Active Conversations</h6>
          </div>
          <div class="tl-chat-list" id="chatListContainer">
            <div class="text-center py-4 text-secondary">
              <div class="spinner-border spinner-border-sm me-2"></div> Loading chats...
            </div>
          </div>
        </div>

        <!-- CHAT MAIN (Message Thread & Form) -->
        <div class="tl-chat-main">
          <!-- Active Chat Header -->
          <div class="tl-chat-header" id="activeChatHeaderTitle">
            <span class="tl-metadata">Select a conversation from the sidebar</span>
          </div>

          <!-- Message Thread -->
          <div class="tl-chat-thread" id="chatMessagesThread">
            <div class="tl-empty-state my-auto">
              <i class="bi bi-chat-square-text fs-1 text-teal"></i>
              <p class="tl-text-secondary">Select a traveler from the sidebar to view messages.</p>
            </div>
          </div>

          <!-- Message Input Form -->
          <form class="tl-chat-input-bar" id="chatSendForm">
            <div class="tl-input-group flex-grow-1">
              <i class="bi bi-chat-left-dots tl-input-icon"></i>
              <input type="text" id="chatInputText" class="tl-input" placeholder="Type your message to traveler..." required autocomplete="off">
            </div>

            <button type="submit" class="tl-btn tl-btn--primary" id="chatSendBtn">
              <i class="bi bi-send-fill"></i> Send
            </button>
          </form>
        </div>

      </div>

    </main>
  </div>
</div>

<!-- Bootstrap 5 Bundle -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

<!-- API Core Scripts -->
<script src="assets/js/config.js"></script>
<script src="assets/js/api/api.js"></script>
<script src="assets/js/api/auth.js"></script>
<script src="assets/js/api/chat.js"></script>

<!-- App Shell & Page Controller -->
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/messages.js"></script>

</body>
</html>
