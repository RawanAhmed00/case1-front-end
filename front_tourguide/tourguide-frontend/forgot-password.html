<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Tailora Tour Guide</title>

  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-guest-only="true" class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 460px;">
    <div class="tl-card p-4 p-md-5 tl-card--accent text-center shadow-lg">

      <!-- Logo & Brand -->
      <div class="mb-4">
        <img src="assets/images/logo.png" alt="Tailora" class="mx-auto mb-3" style="width: 54px; height: 54px; object-fit: contain;">
        <span class="tl-badge tl-badge--info mb-2"><i class="bi bi-compass"></i> Tour Guide Portal</span>
        <h2 class="tl-page-title mt-2 mb-1">Reset Password</h2>
        <p class="tl-text-secondary small mb-0">Enter your email address and we'll send you a password reset link.</p>
      </div>

      <!-- Request Form Panel -->
      <div id="tlForgotFormPanel">
        <form id="tlForgotForm" novalidate class="text-start">
          <div class="tl-field">
            <label for="tlForgotEmail">Email Address</label>
            <div class="tl-input-group">
              <i class="bi bi-envelope tl-input-icon"></i>
              <input type="email" id="tlForgotEmail" class="tl-input" placeholder="guide@tailora.com" required autocomplete="username">
            </div>
            <div class="tl-field-error" id="tlForgotEmailError"></div>
          </div>

          <button type="submit" class="tl-btn tl-btn--primary tl-btn--block py-3 mt-3 fs-6" id="tlForgotSubmitBtn">
            <i class="bi bi-send me-1"></i> Send Reset Link
          </button>
        </form>
      </div>

      <!-- Success Panel -->
      <div id="tlForgotSuccessPanel" style="display: none;" class="py-3">
        <div class="text-teal fs-1 mb-2">
          <i class="bi bi-envelope-check-fill"></i>
        </div>
        <h5 class="text-light mb-2">Check Your Email</h5>
        <p class="tl-text-secondary small mb-0" id="tlForgotSuccessMessage">
          If an account exists for that email address, a password reset link has been sent.
        </p>
      </div>

      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <a href="index.html" class="tl-metadata text-teal text-decoration-none fw-semibold">
          <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 Bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- API Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("tlForgotForm");
      if (!form) return;

      const emailInput = document.getElementById("tlForgotEmail");
      const emailErr = document.getElementById("tlForgotEmailError");
      const submitBtn = document.getElementById("tlForgotSubmitBtn");
      const formPanel = document.getElementById("tlForgotFormPanel");
      const successPanel = document.getElementById("tlForgotSuccessPanel");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (emailErr) emailErr.textContent = "";

        const email = emailInput ? emailInput.value.trim() : "";
        if (!email || !email.includes("@")) {
          if (emailErr) emailErr.textContent = "Please enter a valid email address.";
          return;
        }

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Sending...';
        }

        try {
          await window.TL.Auth.forgotPassword(email);
          if (formPanel) formPanel.style.display = "none";
          if (successPanel) successPanel.style.display = "block";
        } catch (err) {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-send me-1"></i> Send Reset Link';
          }

          if (err instanceof window.TL.Api.ApiValidationError && err.errors && err.errors.email) {
            if (emailErr) emailErr.textContent = err.errors.email.join(" ");
          } else {
            if (emailErr) emailErr.textContent = err.message || "Failed to send reset link. Please try again.";
          }
        }
      });
    });
  </script>
</body>
</html>
