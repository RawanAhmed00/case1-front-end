<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiences — Tailora</title>
<link rel="icon" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tailora.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<div id="tl-nav-mount"></div>

<main>
  <section class="tl-hero" style="padding-bottom:20px;">
    <div class="tl-hero-bg"></div>
    <div class="tl-container">
      <span class="tl-eyebrow">Do</span>
      <h1 class="tl-display tl-mt-8" style="font-size:clamp(30px,4.5vw,48px);max-width:640px;">Attractions and experiences</h1>
      <p class="tl-hero-sub">The moments that make a trip memorable — filter by category.</p>
    </div>
  </section>

  <section class="tl-section tl-section--tight">
    <div class="tl-container">
      <div class="tl-card tl-filter-bar">
        <div class="tl-filter-search">
          <span class="tl-icon">🔍</span>
          <input class="tl-input" id="exp-search" type="text" placeholder="Search experiences...">
        </div>
        <div class="tl-chip-row tl-chip-row--scroll" id="exp-categories">
          <button type="button" class="tl-pill is-active" data-cat="">All</button>
        </div>
      </div>
      <div class="tl-grid" id="experiences-grid"></div>
    </div>
  </section>
</main>

<div id="tl-footer-mount"></div>

<script src="assets/js/api/api.js"></script>
<script src="assets/js/api/auth.js"></script>
<script src="assets/js/api/attractions.js"></script>
<script src="assets/js/api/favorites.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/experiences.js"></script>
</body>
</html>
