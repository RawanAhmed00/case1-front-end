<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotels — Tailora</title>
<link rel="icon" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tailora.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<div id="tl-nav-mount"></div>

<main>
  <section class="tl-hero" style="padding-bottom:20px;">
    <div class="tl-hero-bg"></div>
    <div class="tl-container">
      <span class="tl-eyebrow">Stay</span>
      <h1 class="tl-display tl-mt-8" style="font-size:clamp(30px,4.5vw,48px);max-width:640px;">Places worth waking up in</h1>
      <p class="tl-hero-sub">Every hotel in Tailora's catalog, from boutique stays to full luxury.</p>
    </div>
  </section>

  <section class="tl-section tl-section--tight">
    <div class="tl-container">
      <div class="tl-card tl-filter-bar">
        <div class="tl-filter-search">
          <span class="tl-icon">🔍</span>
          <input class="tl-input" id="hotel-search" type="text" placeholder="Search hotels or cities...">
        </div>
        <select class="tl-select" id="hotel-sort">
          <option value="">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating-desc">Top Rated</option>
        </select>
      </div>
      <div class="tl-grid" id="hotels-grid"></div>
    </div>
  </section>
</main>

<div id="tl-footer-mount"></div>

<script src="assets/js/api/api.js"></script>
<script src="assets/js/api/auth.js"></script>
<script src="assets/js/api/hotels.js"></script>
<script src="assets/js/api/favorites.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/hotels.js"></script>
</body>
</html>
