<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Tailora</title>
<link rel="icon" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tailora.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<div id="tl-nav-mount"></div>

<main class="tl-auth-shell">
  <div class="tl-hero-bg"></div>
  <div class="tl-card tl-auth-card tl-reveal">
    <a href="index.html" class="tl-brand"><img src="assets/images/logo.png" alt=""><span>Tailora</span></a>
    <h1 class="tl-display">Reset your password</h1>
    <p>Enter your email and we'll send you a reset link.</p>

    <div class="tl-auth-alert" id="auth-alert" role="alert"></div>

    <form id="forgot-form" novalidate>
      <div class="tl-field" id="field-email">
        <label for="email">Email address</label>
        <input class="tl-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        <div class="tl-field-error"></div>
      </div>
      <button type="submit" class="tl-btn tl-btn--primary tl-btn--block" id="forgot-submit">Send Reset Link</button>
    </form>

    <div class="tl-auth-switch">Remembered it? <a href="signin.html">Back to sign in</a></div>
  </div>
</main>

<div id="tl-footer-mount"></div>

<script src="assets/js/api/api.js"></script>
<script src="assets/js/api/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/auth-pages.js"></script>
</body>
</html>
