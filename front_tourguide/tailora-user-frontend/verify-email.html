<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — Tailora</title>
<link rel="icon" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tailora.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<div id="tl-nav-mount"></div>

<main class="tl-auth-shell">
  <div class="tl-hero-bg"></div>
  <div class="tl-card tl-auth-card tl-reveal" style="text-align:center;">
    <a href="index.html" class="tl-brand"><img src="assets/images/logo.png" alt=""><span>Tailora</span></a>

    <div id="verify-loading">
      <div class="tl-state-icon">✉️</div>
      <h1 class="tl-display" style="font-size:22px;">Verifying your email…</h1>
      <p>Hang tight, this only takes a moment.</p>
    </div>

    <div id="verify-success" class="tl-hidden">
      <div class="tl-state-icon">✅</div>
      <h1 class="tl-display" style="font-size:22px;">Email verified</h1>
      <p>Your email address has been confirmed. You're all set.</p>
      <a href="index.html" class="tl-btn tl-btn--primary tl-btn--block tl-mt-16">Go to Tailora</a>
    </div>

    <div id="verify-error" class="tl-hidden">
      <div class="tl-state-icon">⚠️</div>
      <h1 class="tl-display" style="font-size:22px;">We couldn't verify that link</h1>
      <p id="verify-error-message">This verification link may have expired or already been used.</p>
      <button type="button" class="tl-btn tl-btn--outline tl-btn--block tl-mt-16" id="resend-btn">Resend Verification Email</button>
      <div class="tl-auth-switch"><a href="signin.html">Back to sign in</a></div>
    </div>
  </div>
</main>

<div id="tl-footer-mount"></div>

<script src="assets/js/api/api.js"></script>
<script src="assets/js/api/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/verify-email.js"></script>
</body>
</html>
