<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel — Tailora</title>
<link rel="icon" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tailora.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<style>
  .tl-hotel-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px; align-items: start; }
  .tl-hotel-book-card { position: sticky; top: 110px; padding: 26px; }
  .tl-hotel-nights-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--tl-border); margin-bottom: 16px; }
  .tl-hotel-summary-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; color: var(--tl-text-secondary); }
  .tl-hotel-summary-row strong { color: var(--tl-text); }
  .tl-room-card { padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 980px) {
    .tl-hotel-layout { grid-template-columns: 1fr; }
    .tl-hotel-book-card { position: static; }
  }
</style>
</head>
<body>

<div id="tl-nav-mount"></div>

<main>
  <div class="tl-container">

    <div id="hotel-loading">
      <div class="tl-skel" style="height:44vh;min-height:320px;border-radius:var(--tl-radius-xl);margin-top:calc(var(--tl-nav-height) + 24px);"></div>
    </div>

    <div id="hotel-error" class="tl-hidden" style="margin-top:calc(var(--tl-nav-height) + 24px);"></div>

    <div id="hotel-shell" class="tl-hidden">
      <div class="tl-detail-hero" id="hotel-hero"></div>

      <section class="tl-section tl-section--tight">
        <div class="tl-hotel-layout">
          <div>
            <div class="tl-card" style="padding:28px;margin-bottom:24px;" id="hotel-about"></div>
            <div class="tl-card" style="padding:28px;margin-bottom:24px;" id="hotel-amenities"></div>
            <div class="tl-card" style="padding:28px;" id="hotel-rooms"></div>
          </div>

          <div class="tl-card tl-hotel-book-card">
            <h3 style="margin-bottom:6px;">Add this hotel to your booking</h3>
            <p class="tl-text-secondary" style="font-size:13px;margin-bottom:6px;">Choose how many nights you're staying.</p>

            <div class="tl-hotel-nights-row">
              <span>Number of nights</span>
              <div class="tl-stepper-input">
                <button type="button" id="nights-minus">−</button>
                <span id="nights-count">1</span>
                <button type="button" id="nights-plus">+</button>
              </div>
            </div>

            <div id="hotel-summary"></div>

            <button type="button" class="tl-btn tl-btn--primary tl-btn--block tl-mt-16" id="add-to-booking-btn">Add to Booking</button>
            <a href="bookings.html" class="tl-btn tl-btn--ghost tl-btn--block tl-mt-8">View Booking Summary</a>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>

<div id="tl-footer-mount"></div>

<script src="assets/js/api/api.js"></script>
<script src="assets/js/api/auth.js"></script>
<script src="assets/js/api/hotels.js"></script>
<script src="assets/js/api/favorites.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/pages/hotel-details.js"></script>
</body>
</html>
