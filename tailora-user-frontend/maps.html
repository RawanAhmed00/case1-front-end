<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Map — Tailora</title>
<link rel="icon" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tailora.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/maps.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/maps.css">
</head>
<body>
<div id="tl-nav-mount"></div>
<main>
<section class="tl-hero tl-map-hero">
<div class="tl-hero-bg"></div><div class="tl-container">
<span class="tl-eyebrow">Explore</span>
<h1 class="tl-display tl-mt-8">Discover Tailora on the map</h1>
<p class="tl-hero-sub">Explore attractions, hotels and restaurants, then build a route between any two points.</p>
</div></section>
<section class="tl-section tl-section--tight"><div class="tl-container">
<div class="tl-card tl-map-toolbar">
<div class="tl-map-search"><span class="tl-icon">⌕</span><input class="tl-input" id="map-search" type="search" placeholder="Search attractions, hotels or restaurants..."></div>
<div class="tl-map-filters">
<button type="button" class="tl-map-filter is-active" data-type="all">All</button>
<button type="button" class="tl-map-filter" data-type="attraction">Attractions</button>
<button type="button" class="tl-map-filter" data-type="hotel">Hotels</button>
<button type="button" class="tl-map-filter" data-type="restaurant">Restaurants</button>
</div></div>
<div class="tl-map-layout">
<aside class="tl-card tl-map-sidebar">
<div class="tl-map-sidebar-head"><div><span class="tl-eyebrow">Directions</span><h2>Plan a route</h2></div>
<button type="button" class="tl-btn tl-btn--ghost" id="map-clear-route">Clear</button></div>
<div class="tl-route-fields">
<label class="tl-map-field"><span>Start</span><div class="tl-route-input-row">
<input class="tl-input" id="route-start" type="text" placeholder="Click a map point" readonly>
<button type="button" class="tl-map-small-btn" id="route-use-location" title="Use my location">⌖</button></div></label>
<label class="tl-map-field"><span>Destination</span><input class="tl-input" id="route-end" type="text" placeholder="Click a map point" readonly></label>
<button type="button" class="tl-btn tl-btn--primary tl-route-btn" id="route-build" disabled>Get Directions</button>
</div>
<div id="route-summary" class="tl-route-summary" hidden></div>
<div class="tl-map-legend"><div class="tl-map-legend-title">Map markers</div>
<div><span class="tl-map-dot tl-map-dot--attraction"></span> Attractions</div>
<div><span class="tl-map-dot tl-map-dot--hotel"></span> Hotels</div>
<div><span class="tl-map-dot tl-map-dot--restaurant"></span> Restaurants</div></div>
<div class="tl-map-counts" id="map-counts">Loading locations...</div>
<div id="map-error" class="tl-map-error" hidden></div>
</aside>
<section class="tl-card tl-map-card"><div id="tailora-map"></div>
<div id="map-loading" class="tl-map-loading"><div class="tl-map-spinner"></div><span>Loading locations...</span></div></section>
</div></div></section>
</main>
<div id="tl-footer-mount"></div>
<script src="assets/js/api/api.js"></script>
<script src="assets/js/api/auth.js"></script>
<script src="assets/js/api/attractions.js"></script>
<script src="assets/js/api/hotels.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/pages/maps.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/pages/maps.js"></script>
</body>
</html>
